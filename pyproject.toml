[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiktok-forge"
version = "1.1.0"
description = "TikTok signature forge: real web (X-Bogus via the vendor SDK) and app (Argus/Gorgon/Ladon/TTEncrypt) signatures"
readme = "README_PYPI.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "MERO" }]
keywords = [
    "tiktok",
    "signature",
    "api",
    "authentication",
    "android",
    "x-bogus",
    "x-gorgon",
    "x-argus",
    "x-ladon",
    "x-khronos",
    "mstoken",
    "ttwid",
    "verifyfp",
    "ttencrypt",
    "webmssdk",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pycryptodome>=3.20.0", "requests>=2.28.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/6x-u/tiktok-forge"
Repository = "https://github.com/6x-u/tiktok-forge"
Issues = "https://github.com/6x-u/tiktok-forge/issues"
Changelog = "https://github.com/6x-u/tiktok-forge/releases"

[project.scripts]
tiktokforge-verify = "tiktokforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tiktokforge"]

[tool.hatch.build.targets.wheel.force-include]
"tiktokforge/js/webmssdk.js" = "tiktokforge/js/webmssdk.js"
"tiktokforge/js/shim.js" = "tiktokforge/js/shim.js"
"tiktokforge/js/sign_server.js" = "tiktokforge/js/sign_server.js"
"tiktokforge/js/bundle_meta.json" = "tiktokforge/js/bundle_meta.json"

[tool.hatch.build.targets.sdist]
include = [
    "tiktokforge/**",
    "tools/**",
    "examples/**",
    "tests/**",
    "README.md",
    "README_PYPI.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "/.gitignore",
    "/.pytest_cache",
    "**/__pycache__",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
